<svg width="600" height="450" viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="450" fill="#14171C"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#262B33" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="450" fill="url(#grid)"/>

  <!-- central node -->
  <circle cx="300" cy="225" r="26" fill="#0B0D10" stroke="#FF8A3D" stroke-width="2"/>
  <circle cx="300" cy="225" r="6" fill="#FF8A3D"/>

  <!-- partner nodes -->
  <g stroke="#363D48" stroke-width="1.5">
    <line x1="300" y1="225" x2="150" y2="120"/>
    <line x1="300" y1="225" x2="150" y2="330"/>
    <line x1="300" y1="225" x2="450" y2="120"/>
    <line x1="300" y1="225" x2="450" y2="330"/>
    <line x1="300" y1="225" x2="120" y2="225"/>
    <line x1="300" y1="225" x2="480" y2="225"/>
  </g>

  <g fill="#191D24" stroke="#4FD8C4" stroke-width="1.5">
    <circle cx="150" cy="120" r="14"/>
    <circle cx="150" cy="330" r="14"/>
    <circle cx="450" cy="120" r="14"/>
    <circle cx="450" cy="330" r="14"/>
    <circle cx="120" cy="225" r="14"/>
    <circle cx="480" cy="225" r="14"/>
  </g>

  <text x="300" y="410" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#5A6270" letter-spacing="1">
    PARTNER NETWORK · SHARED VISIBILITY
  </text>
</svg>
